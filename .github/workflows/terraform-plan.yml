name: terraform-plan

on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/terraform-plan.yml"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: tf-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  plan:
    name: plan (${{ matrix.environment }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, prod]
    defaults:
      run:
        working-directory: infra/envs/${{ matrix.environment }}
    env:
      TF_IN_AUTOMATION: "true"
      TF_VAR_plan_only: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff ../..

      # No AWS account for this exercise, so swap the S3 backend for a local
      # one. Real pipeline: drop this step and use aws-actions/configure-aws-credentials (OIDC).
      - name: Use local backend (plan-only mode)
        run: |
          cat > backend_override.tf <<'HCL'
          terraform {
            backend "local" {}
          }
          HCL

      - name: terraform init
        run: terraform init -input=false

      - name: terraform validate
        run: terraform validate -no-color

      - name: terraform plan
        run: |
          terraform plan -refresh=false -input=false -no-color -out=tfplan
          terraform show -no-color tfplan > plan.txt

      - name: Add plan to job summary
        run: |
          {
            echo "### Terraform plan - ${{ matrix.environment }}"
            echo '```'
            tail -c 60000 plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ matrix.environment }}
          path: infra/envs/${{ matrix.environment }}/plan.txt
          retention-days: 7

      - name: Comment plan on PR
        uses: actions/github-script@v7
        env:
          ENVIRONMENT: ${{ matrix.environment }}
        with:
          script: |
            const fs = require('fs');
            const env = process.env.ENVIRONMENT;
            let plan = fs.readFileSync(`infra/envs/${env}/plan.txt`, 'utf8');
            if (plan.length > 60000) {
              plan = '...(truncated, full plan in artifact)...\n' + plan.slice(-60000);
            }
            const marker = `<!-- tf-plan-${env} -->`;
            const body = `${marker}\n### Terraform plan: \`${env}\`\n<details><summary>Show plan</summary>\n\n\`\`\`\n${plan}\n\`\`\`\n</details>`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
